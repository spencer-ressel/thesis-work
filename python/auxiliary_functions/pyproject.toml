[project]
name = "auxiliary_functions"
version = "0.1.0"
description = "Shared utility functions for my scientific workflows"
authors = [
    { name = "Spencer" }
]
readme = "README.md"
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/spencer-ressel/thesis-work"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
